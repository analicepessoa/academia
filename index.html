<script>
    const SUPABASE_URL = "https://znpeniqeagmeztwsuwbk.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_2VWFh2oe_n6xg9Xo_TIHIQ_W_CJPO0J"; 
    
    let supabase;
    let currentCalendarDate = new Date();
    let cacheTrainedDays = [];

    // Aguarda o navegador carregar completamente antes de iniciar a nuvem
    window.addEventListener('DOMContentLoaded', () => {
        try {
            // Garante compatibilidade com o formato global exigido em celulares
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                fetchTrainedDays();
            } else {
                document.getElementById('syncStatus').innerText = "🔴 Erro: Biblioteca corrompida";
                renderCalendar();
            }
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').innerText = "🔴 Erro na inicialização";
            renderCalendar();
        }
    });

    function switchDay(dayId) {
        document.querySelectorAll('.workout-card').forEach(card => card.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(dayId).classList.add('active');
        if(event) event.currentTarget.classList.add('active');
        updateProgressBar(dayId);
    }

    function toggleExercise(id) {
        const item = document.getElementById(id);
        const checkbox = item.querySelector('input[type="checkbox"]');
        if (event && event.target.type !== 'checkbox' && event.target.tagName !== 'A') {
            checkbox.checked = !checkbox.checked;
        }
        if (checkbox.checked) item.classList.add('completed');
        else item.classList.remove('completed');
        
        updateProgressBar(item.closest('.workout-card').id);
    }

    function updateProgressBar(dayId) {
        const card = document.getElementById(dayId);
        const total = card.querySelectorAll('.exercise-item').length;
        const checked = card.querySelectorAll('input[type="checkbox"]:checked').length;
        document.getElementById('progressBar').style.width = total > 0 ? (checked / total) * 100 + '%' : '0%';
    }

    async function fetchTrainedDays() {
        const statusEl = document.getElementById('syncStatus');
        if(!supabase) return;

        try {
            const { data, error } = await supabase
                .from('treinos_concluidos')
                .select('data_treino');

            if (error) throw error;

            cacheTrainedDays = data.map(item => item.data_treino);
            if(statusEl) statusEl.innerText = "🟢 Nuvem Ativa";
            renderCalendar();
        } catch (err) {
            console.error(err);
            if(statusEl) statusEl.innerText = "🔴 Sem acesso à tabela";
            renderCalendar();
        }
    }

    async function saveProgress(dayName) {
        const today = new Date();
        const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

        if (cacheTrainedDays.includes(todayStr)) {
            alert("Você já salvou o treino de hoje na nuvem!");
            return;
        }

        document.getElementById('syncStatus').innerText = "📤 Salvando...";
        try {
            const { error } = await supabase
                .from('treinos_concluidos')
                .insert([{ data_treino: todayStr }]);

            if (error) throw error;

            alert(`Excelente! Treino de ${dayName} salvom com sucesso na nuvem! 🚀`);
            fetchTrainedDays();
        } catch (err) {
            alert("Erro ao salvar! Verifique a permissão RLS da sua tabela no Supabase.");
            console.error(err);
        }
    }

    function changeMonth(direction) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        if(!grid) return;
        grid.innerHTML = '';

        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();

        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const monthTitle = document.getElementById('monthDisplay');
        if(monthTitle) monthTitle.innerText = `${monthNames[month]} ${year}`;

        const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        daysOfWeek.forEach(day => {
            const el = document.createElement('div');
            el.className = 'calendar-day-name';
            el.innerText = day;
            grid.appendChild(el);
        });

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const realToday = new Date();
        const realTodayStr = realToday.getFullYear() + '-' + String(realToday.getMonth() + 1).padStart(2, '0') + '-' + String(realToday.getDate()).padStart(2, '0');

        for (let i = 0; i < firstDayOfMonth; i++) {
            grid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = 'calendar-day active-month';
            dayCell.innerText = day;

            const currentMonthStr = String(month + 1).padStart(2, '0');
            const currentDayStr = String(day).padStart(2, '0');
            const dateKey = `${year}-${currentMonthStr}-${currentDayStr}`;

            if (cacheTrainedDays.includes(dateKey)) {
                dayCell.classList.add('trained');
                dayCell.innerText = day + " 🔥";
            }

            if (dateKey === realTodayStr) {
                dayCell.classList.add('today');
            }

            grid.appendChild(dayCell);
        }
    }
</script>
</body>
</html>
